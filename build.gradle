plugins {
    id 'fabric-loom' version '1.16-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}


repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation 'com.google.code.gson:gson:2.10.1'
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 8
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    it.options.encoding = "UTF-8"
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

/**
 * One file somebody can run a dedicated server from, without this repository.
 *
 * The mod jar cannot do it. Gson is provided by Minecraft at runtime, so a standalone JVM
 * loading that jar dies on NoClassDefFoundError before it prints anything — and the
 * answer "also download gson and put it on the classpath" is not one to give somebody who
 * just wants to run a server.
 *
 * Only `core` goes in. That package imports no Minecraft, which is the same property the
 * test suites rely on, and it is what makes 600 KB enough. `client` and `mixin` are
 * excluded because they would drag the game in behind them.
 *
 * java -jar economies-server.jar --write-config
 */
tasks.register('serverJar', Jar) {
    group = 'build'
    description = 'A standalone runnable jar for the dedicated server.'
    archiveBaseName = 'economies-server'
    archiveVersion = ''
    destinationDirectory = layout.buildDirectory.dir('libs')

    manifest {
        attributes 'Main-Class': 'io.github.badbull643.economiesmod.core.net.HostServer'
    }

    from(sourceSets.main.output) {
        include 'io/github/badbull643/economiesmod/core/**'
    }
    // Unpacked rather than nested: java -jar reads no classpath from inside a jar, so a
    // dependency has to be flattened in beside the classes that use it.
    from configurations.runtimeClasspath
            .filter { it.name.startsWith('gson') }
            .collect { zipTree(it) }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'

    from("LICENSE")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// The core engine imports no Minecraft, so the whole suite runs on a bare JVM in
// milliseconds. Exits non-zero on failure, so this is safe to gate on.
tasks.register('coreTests', JavaExec) {
    group = 'verification'
    description = 'Runs the core engine test suite without launching Minecraft.'
    mainClass = 'io.github.badbull643.economiesmod.core.MarketTests'
    classpath = sourceSets.main.runtimeClasspath
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

// dev only delete on launch

/*loom {
    runs {
        client {
            programArgs "--username", "Dev"
        }
    }
}*/

loom {
    runs {
        clientAlice {
            client()
            configName = "Minecraft Alice"
            programArgs "--username", "Alice"
        }
        clientBob {
            client()
            configName = "Minecraft Bob"
            programArgs "--username", "Bob"
        }
    }
}

// Networking smoke test: binds sockets and signs a few thousand events, so it is
// kept out of coreTests, which stays pure and instant.
tasks.register('chunkTest', JavaExec) {
    group = 'verification'
    description = 'End-to-end check that an over-sized history still syncs.'
    mainClass = 'io.github.badbull643.economiesmod.core.net.ChunkTest'
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('replayGuardTest', JavaExec) {
    group = 'verification'
    description = 'Checks a synced history is not mistaken for live traffic.'
    mainClass = 'io.github.badbull643.economiesmod.core.net.ReplayGuardTest'
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('splitPointTest', JavaExec) {
    group = 'verification'
    description = 'Checks two branches of one market can be told where they parted.'
    mainClass = 'io.github.badbull643.economiesmod.core.net.SplitPointTest'
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('hostTrustTest', JavaExec) {
    group = 'verification'
    description = 'Checks a host is trusted to order events and for nothing else.'
    mainClass = 'io.github.badbull643.economiesmod.core.net.HostTrustTest'
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('gapRecoveryTest', JavaExec) {
    group = 'verification'
    description = 'Checks a missed broadcast is noticed and can be recovered from.'
    mainClass = 'io.github.badbull643.economiesmod.core.net.GapRecoveryTest'
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('admissionTest', JavaExec) {
    group = 'verification'
    description = 'Checks admission policy holds on every door, including pre-handshake.'
    mainClass = 'io.github.badbull643.economiesmod.core.net.AdmissionTest'
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('depositCapTest', JavaExec) {
    group = 'verification'
    description = 'Checks a deposit cap is enforced against a real client.'
    mainClass = 'io.github.badbull643.economiesmod.core.net.DepositCapTest'
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('attestationTest', JavaExec) {
    group = 'verification'
    description = 'Checks a world attestation reaches the host and is acted on.'
    mainClass = 'io.github.badbull643.economiesmod.core.net.AttestationTest'
    classpath = sourceSets.main.runtimeClasspath
}

// Lets the dedicated launcher be exercised from a shell the same way an operator
// would run it, rather than only through a JavaExec task with baked-in arguments.
tasks.register('hostServer', JavaExec) {
    group = 'application'
    description = 'Runs the standalone dedicated server (no Minecraft).'
    mainClass = 'io.github.badbull643.economiesmod.core.net.HostServer'
    classpath = sourceSets.main.runtimeClasspath
}
